services:
  app:
    build: .
    container_name: ls-dashboard
    restart: unless-stopped
    expose:
      - "8501"                       # interno; o Traefik faz o ingress + HTTPS
    # Segredos vêm do arquivo .env na raiz do projeto (na VPS, fora do git):
    #   BRAPI_TOKEN=...
    #   ANTHROPIC_API_KEY=sk-ant-...
    # O docker compose lê o .env automaticamente e as linhas abaixo injetam
    # os valores no container. Sem .env, ficam vazios e o app pede na UI.
    environment:
      - BRAPI_TOKEN=${BRAPI_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # Monta o DIRETORIO .streamlit (nao o arquivo secrets.toml): bind de
    # arquivo inexistente faz o Docker criar um diretorio fantasma no host,
    # que depois impede qualquer `cat > secrets.toml` de funcionar.
    volumes:
      - ./.streamlit:/app/.streamlit:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ls-dashboard.rule=Host(`longshort.marketwatchrf.com`)"
      - "traefik.http.routers.ls-dashboard.entrypoints=websecure"
      - "traefik.http.routers.ls-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.ls-dashboard.loadbalancer.server.port=8501"
      # Basic Auth: credenciais vem do .env (LS_AUTH_USERS=usuario:hash-apr1).
      # Gere o hash na VPS com:  openssl passwd -apr1
      # O :? faz o compose falhar com mensagem clara se a variavel faltar,
      # em vez de subir o site aberto ou com o router quebrado em silencio.
      - "traefik.http.routers.ls-dashboard.middlewares=ls-dashboard-auth"
      - "traefik.http.middlewares.ls-dashboard-auth.basicauth.users=${LS_AUTH_USERS:?defina LS_AUTH_USERS no .env — veja DEPLOY.md}"
    networks:
      - default

# O Traefik (host network) alcanca o container pela rede bridge padrao do compose,
# do mesmo jeito que ja faz com seus outros apps (ex.: oly-market-watch, bolsonoazul).
networks:
  default:
