services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8501"                       # só interno; o Caddy expõe pra internet
    volumes:
      # A API key vive num arquivo no servidor, montado só-leitura.
      # Crie .streamlit/secrets.toml antes de subir (veja DEPLOY.md).
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data             # guarda os certificados HTTPS (persistente)
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
