# Fonte da verdade das cores base. O restante do design system vive em
# theme.py — não duplique valores aqui.
[theme]
base = "dark"
primaryColor = "#cba6f7"
backgroundColor = "#1e1e2e"
secondaryBackgroundColor = "#313244"
textColor = "#cdd6f4"

[server]
headless = true
# enableCORS = false foi removido: é incompatível com enableXsrfProtection
# (padrão true) e o Streamlit o sobrescrevia com um aviso a cada boot.
